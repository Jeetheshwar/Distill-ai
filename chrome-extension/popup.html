<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding: 16px; }
    h2 { margin: 0 0 16px 0; font-size: 18px; color: #E4DDF4; border-bottom: 1px solid #333; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .status { font-size: 12px; color: #8A859C; margin-bottom: 16px; display: flex; justify-content: space-between; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
    #startBtn { background: #4826B9; color: white; }
    #stopBtn { background: #ef4444; color: white; display: none; }
    #sendToJiraBtn { background: #0052CC; color: white; display: none; }
    input { width: 100%; padding: 8px; box-sizing: border-box; background: #111; border: 1px solid #333; color: white; border-radius: 4px; margin-bottom: 16px; }
    label { font-size: 12px; color: #8A859C; display: block; margin-bottom: 4px; }
    #preview { display: none; background: #111; padding: 12px; border-radius: 6px; font-size: 12px; border: 1px solid #333; max-height: 150px; overflow-y: auto; margin-bottom: 12px; }
    .ticket { border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 8px; }
    .ticket:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .ticket-title { font-weight: bold; margin-bottom: 4px; }
    .ticket-meta { color: #8A859C; font-size: 10px; }
    .loader { display: none; text-align: center; color: #4826B9; font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
    Distill AI
  </h2>
  <div class="status">
    <span id="statusText">Status: Ready</span>
    <span id="timer" style="display: none;">00:00</span>
  </div>

  <label>Distill API Endpoint</label>
  <input type="text" id="apiEndpoint" placeholder="http://localhost:3000/api/extract" value="http://localhost:3000/api/extract" />

  <label>Groq API Key (BYOK)</label>
  <input type="password" id="apiKey" placeholder="gsk_..." />

  <button id="startBtn">Start Recording</button>
  <button id="stopBtn">Stop & Distill</button>
  
  <div id="loader" class="loader">Processing audio...</div>
  <div id="preview"></div>

  <button id="sendToJiraBtn">Send to Jira</button>

  <script src="popup.js"></script>
</body>
</html>
