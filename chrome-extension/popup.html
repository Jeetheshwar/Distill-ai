<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
    h2 { margin: 0 0 20px 0; font-size: 18px; color: #E4DDF4; border-bottom: 1px solid #222; padding-bottom: 12px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .status { font-size: 13px; color: #8A859C; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 12px; font-size: 14px; position: relative; overflow: hidden; }
    button:active { transform: scale(0.98); }
    #startBtn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39); }
    #startBtn:hover { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.23); }
    #stopBtn { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; display: none; box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.39); }
    #stopBtn:hover { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.23); }
    #sendToJiraBtn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; display: none; box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39); }
    #sendToJiraBtn:hover { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
    #retryBtn { display: none; background: #27272a; color: #fff; margin-top: 8px; border: 1px solid #3f3f46; }
    #retryBtn:hover { background: #3f3f46; }
    .input-group { position: relative; margin-bottom: 16px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 6px; font-size: 12px; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #6366f1; }
    label { font-size: 12px; color: #8A859C; display: block; margin-bottom: 6px; font-weight: 500; }
    .eye-icon { position: absolute; right: 10px; top: 32px; cursor: pointer; color: #8A859C; transition: color 0.2s; padding: 4px; }
    .eye-icon:hover { color: #fff; }
    #preview { display: none; background: #0a0a0a; padding: 12px; border-radius: 8px; font-size: 12px; border: 1px solid #333; max-height: 180px; overflow-y: auto; margin-bottom: 16px; }
    .ticket { border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 10px; }
    .ticket:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .ticket-title { font-weight: 600; margin-bottom: 4px; color: #fff; }
    .ticket-meta { color: #8A859C; font-size: 11px; }
    .loader { display: none; text-align: center; color: #a78bfa; font-size: 13px; margin-bottom: 16px; font-weight: 500; }
    #errorContainer { display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h2>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
    Distill AI
  </h2>
  <div class="status">
    <span id="statusText">Status: Ready</span>
    <span id="timer" style="display: none; font-variant-numeric: tabular-nums;">00:00</span>
  </div>

  <div id="errorContainer"></div>

  <label>Distill API Endpoint</label>
  <input type="text" id="apiEndpoint" placeholder="http://localhost:3000/api/extract" value="http://localhost:3000/api/extract" />

  <label>Jira Webhook URL</label>
  <input type="text" id="webhookUrl" placeholder="https://your-domain.com/api/webhook" />

  <div class="input-group">
    <label>Groq API Key (BYOK)</label>
    <input type="password" id="apiKey" placeholder="gsk_..." />
    <svg class="eye-icon" id="togglePassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
    </svg>
  </div>

  <button id="startBtn">Start Recording</button>
  <button id="stopBtn">Stop & Distill</button>
  
  <div id="loader" class="loader">Processing audio...</div>
  <div id="preview"></div>

  <button id="sendToJiraBtn">Send to Jira</button>
  <button id="retryBtn" style="display: none; background: #333; color: #fff;">Back / Retry</button>

  <script src="popup.js"></script>
</body>
</html>
